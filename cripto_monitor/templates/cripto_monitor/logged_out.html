{% extends 'cripto_monitor/base.html' %}
{% load static %}

{% block content %}
<style>
    .logout-panel {
        border: 1px solid var(--bs-border-color);
        border-radius: 8px;
        margin: 0 auto;
        max-width: 34rem;
        padding: clamp(1.25rem, 3vw, 2rem);
        text-align: center;
    }

    .logout-logo {
        border: 1px solid rgba(229, 178, 73, .55);
        border-radius: 14px;
        height: auto;
        margin-bottom: 1rem;
        max-width: min(220px, 78vw);
        width: 100%;
    }

    .logout-title {
        font-weight: 900;
        margin-bottom: .5rem;
    }

    .logout-message {
        color: var(--bs-secondary-color);
        font-weight: 700;
        margin-bottom: 1.25rem;
    }

    .logout-actions {
        display: flex;
        flex-wrap: wrap;
        gap: .65rem;
        justify-content: center;
    }
</style>

<section class="logout-panel">
    <img class="logout-logo" src="{% static 'cripto_monitor/GDH_CRIPTO.png' %}" alt="GDH Cripto">
    <h1 class="h3 logout-title">Você saiu da sessão</h1>
    <p class="logout-message">É necessário criar usuário e senha para fazer as simulações.</p>
    <div class="logout-actions">
        <a class="btn btn-primary" href="{% url 'cripto_monitor:my_simulations' %}">Criar usuário</a>
        <a class="btn btn-outline-secondary" href="{% url 'login' %}">Entrar novamente</a>
    </div>
</section>
{% endblock %}
